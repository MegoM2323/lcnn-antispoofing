# фронт-энд LFCC из arXiv:2103.11326: окно 20 мс с шагом 10 мс, 512-точечное FFT,
# 20 треугольных фильтров в линейной шкале, c0 заменён логарифмом энергии,
# плюс delta и delta-delta.
train:
  data_object: # имя тензора, к которому применяется трансформ
    _target_: torch.nn.Sequential # чтобы применить несколько трансформов подряд
    _args_:
      - _target_: src.transforms.LFCC
        sample_rate: 16000
        n_filter: 20
        n_lfcc: 20
        win_length: 320
        hop_length: 160
        n_fft: 512
        with_delta: true
        with_energy: true
        n_frames: 750
        crop: random
        pad_mode: repeat
inference:
  data_object:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.LFCC
        sample_rate: 16000
        n_filter: 20
        n_lfcc: 20
        win_length: 320
        hop_length: 160
        n_fft: 512
        with_delta: true
        with_energy: true
        n_frames: 750
        crop: first
        pad_mode: repeat
