# FFT-LCNN front-end from arXiv:1904.05576: 1724-point FFT, Blackman window,
# 863 frequency bins, first 600 frames, no CMVN.
train:
  data_object: # name of the tensor on which we apply transform
    _target_: torch.nn.Sequential # to apply several transforms sequentially
    _args_:
      - _target_: src.transforms.LogSpectrogram
        n_fft: 1724
        win_length: 1724
        hop_length: 130
        window: blackman
        power: 2.0
        eps: 1e-8
        n_frames: 600
        crop: random # random slice of a long utterance acts as augmentation
        pad_mode: repeat
      # augmentation is off by default: add src.transforms.SpecAugment here to
      # enable it, see src/transforms/augment.py for the parameters
inference:
  data_object:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.LogSpectrogram
        n_fft: 1724
        win_length: 1724
        hop_length: 130
        window: blackman
        power: 2.0
        eps: 1e-8
        n_frames: 600
        crop: first # "only the first 600 features for each file were used"
        pad_mode: repeat
