defaults:
  - model: lcnn
  - writer: cometml
  - metrics: accuracy
  - datasets: asvspoof
  - dataloader: asvspoof
  - transforms: stft
  - _self_
# число отсчётов в каждом сигнале батча, около 4,87 с при 16 кГц.
# Датасеты обрезают записи до этой же длины прямо при загрузке.
collate_max_len: 77870
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 1e-4
lr_scheduler:
  # arXiv:2103.11326: lr уполовинивается каждые 10 эпох. Шаблон вызывает
  # scheduler.step() после каждого батча, поэтому step_size задан в батчах:
  # 10 эпох * 793 батча (25380 обучающих записей / batch_size 32, drop_last).
  # Значение надо держать согласованным с dataloader.batch_size.
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5
  step_size: 7930
loss_function:
  _target_: src.loss.CELoss
  # train-партиция LA несбалансирована: 22800 spoof / 2580 bonafide = 8.84
  class_weights: [1.0, 8.84]
writer:
  project_name: "asvspoof-lcnn"
  workspace: null # берётся из ~/.comet.config
  run_name: "lcnn_stft"
  loss_names: ["loss"]
trainer:
  log_step: 50
  n_epochs: 30
  epoch_len: null # null -> эпоха это проход по всей train-партиции
  device_tensors: ["data_object", "labels"] # какие тензоры класть на устройство (например, GPU)
  resume_from: null # null или путь к каталогу чекпоинта с *.pth и config.yaml
  device: auto # имя устройства или "auto"
  use_amp: True # bf16 autocast: при входе 863x600 узкое место по памяти это активации
  amp_dtype: bfloat16
  max_grad_norm: 5
  skip_oom: True
  override: False # если True, предыдущий запуск с тем же именем будет перезаписан
  monitor: "min dev_EER" # EER считается по всей dev-партиции, меньше значит лучше
  save_period: 5 # чекпоинт каждые save_period эпох вдобавок к лучшей эпохе
  early_stop: 10 # эпох до ранней остановки
  save_dir: "saved"
  seed: 1
  # True даёт ускорение примерно в 2,1 раза (70 -> 145 записей/с), но запуск
  # перестаёт быть побитово воспроизводимым: cuDNN подбирает алгоритмы замером
  cudnn_benchmark: False
