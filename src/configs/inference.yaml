defaults:
  - model: lcnn
  - metrics: accuracy
  - datasets: asvspoof_eval # we do not want to run inference on training data
  - dataloader: asvspoof
  - transforms: stft
  - _self_
# must match the length the model was trained with (see lcnn.yaml)
collate_max_len: 77870
inferencer:
  device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  use_amp: False # fp32 scores for the submission, bf16 only changes speed
  amp_dtype: bfloat16
  save_path: "eval" # predictions are saved to data/saved/${inferencer.save_path}
  seed: 1
  cudnn_benchmark: False # see trainer.cudnn_benchmark in lcnn.yaml
  from_pretrained: "saved/lcnn_stft_600f/model_best.pth" # path to the pretrained model
