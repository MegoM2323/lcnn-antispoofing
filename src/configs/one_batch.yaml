defaults:
  - lcnn
  - override /datasets: one_batch_test
  - _self_
model:
  dropout: 0.0 # a memorized batch must give a near-zero loss, not a noisy one
dataloader:
  # the sanity check runs on 64 fixed utterances, workers are not needed
  num_workers: 2
  persistent_workers: False
  # fp32 with the 863x600 input does not fit into 12 GB with the default 32
  batch_size: 16
lr_scheduler:
  step_size: 1000000 # constant lr: the model must overfit, not converge
loss_function:
  class_weights: null # the subset is tiny, reweighting only adds noise
writer:
  run_name: "one_batch_test"
  mode: "offline"
trainer:
  log_step: 5
  n_epochs: 50
  use_amp: False # fp32, so that a failed check means a broken pipeline and not bf16
  override: True # the check is re-run often
  early_stop: 50
  save_period: 50
