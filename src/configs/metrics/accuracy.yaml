device: "auto"
train: # метрики, которые считаются во время обучения
  - _target_: src.metrics.AccuracyMetric
    name: "TRAIN_Accuracy"
inference: # метрики, которые считаются во время инференса (eval)
  # Побатчевого EER здесь нет: MetricTracker усредняет значения по батчам, а
  # dev-партиция начинается с 79 батчей из 777, где есть только bonafide,
  # поэтому среднее вырождается в константу (50.0 * 79 / 777 = 5.0837), которая
  # побитово повторяется от эпохи к эпохе и ничего не говорит о модели. EER всей
  # партиции считают отдельно тренер и инференсер, он логируется как
  # "{part}_EER".
  - _target_: src.metrics.AccuracyMetric
    name: "Accuracy"
