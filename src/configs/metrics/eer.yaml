device: "auto"
train: # metrics that are calculated during training
  - _target_: src.metrics.AccuracyMetric
    name: "TRAIN_Accuracy"
inference: # metrics that are calculated during inference (eval)
  # No running EER here: MetricTracker averages the per-batch values, and the
  # dev partition starts with 79 bonafide-only batches out of 777, so the
  # average degenerates into a constant (50.0 * 79 / 777 = 5.0837) that repeats
  # bit for bit across epochs and says nothing about the model. The EER of the
  # whole partition is computed separately by the trainer and the inferencer
  # and is logged as "{part}_EER".
  - _target_: src.metrics.AccuracyMetric
    name: "Accuracy"
